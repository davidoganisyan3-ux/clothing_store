<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина — Магазин одежды</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1 class="logo">Магазин одежды</h1>
    <nav class="nav" aria-label="Основное меню">
      <a href="/index.html">Каталог</a>
      <a href="/cart.html" aria-current="page">Корзина</a>
      <span id="auth-nav" class="auth-nav"></span>
    </nav>
  </header>

  <main class="cart-page">
    <h2 class="page-title">Корзина</h2>

    <div id="cart-empty" class="status" hidden>
      В корзине пока пусто. <a href="/index.html">Перейти в каталог</a>
    </div>

    <div id="order-done" class="order-done" hidden>
      <h3>Заказ оформлен</h3>
      <p>Спасибо за покупку! <a href="/index.html">Вернуться в каталог</a></p>
    </div>

    <ul id="cart-list" class="cart-list"></ul>

    <section id="cart-summary" class="cart-summary" hidden>
      <p class="cart-total">Итого: <strong id="cart-total"></strong></p>
      <button id="checkout-button" class="buy" type="button">Оформить заказ</button>
    </section>

    <p id="checkout-error" class="form-error" role="alert" hidden></p>
  </main>

  <script src="/common.js"></script>
  <script src="/cart.js"></script>
</body>
</html>
